# Databuild en Pages-deployment.
#
# UITGESCHAKELD: deze workflow draait niet meer automatisch. De uurlijkse
# cron en de push-trigger op main zijn verwijderd; alleen een handmatige
# workflow_dispatch start nog een run. Zet de triggers hieronder terug om de
# automatische publicatie weer aan te zetten.
#
# Oorspronkelijk gedrag (geldt nog bij een handmatige run): een push naar main
# herpubliceerde alleen de frontend: de pipeline-stap wordt overgeslagen en de
# data komt ongewijzigd uit het laatst gepubliceerde artefact (via
# pipeline.restore).
#
# Technische buildregels:
# - secrets alleen via GitHub Actions Secrets (FIRMS_MAP_KEY), nooit in logs;
# - een gefaalde bron blokkeert de andere lagen niet (stale_reused-fallback);
# - een PII/secret-overtreding laat pipeline.run met exitcode 1 falen en er
#   wordt dan niets gedeployed — de vorige deployment blijft staan;
# - een push-run zonder bereikbaar vorig artefact faalt in plaats van een
#   site zonder data te deployen;
# - concurrency voorkomt dat een oude run over een nieuwere heen publiceert.

name: build

on:
  # Automatische triggers bewust uitgeschakeld; alleen handmatig te starten.
  # schedule:
  #   - cron: "7 * * * *" # elk uur; niet op :00 vanwege GitHub-cronpiek
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Dependencies installeren
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      - name: Vorig artefact ophalen (stale_reused-fallback, best effort)
        run: |
          uv run python -m pipeline.restore \
            --base-url "${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/data" \
            --output public/data || true

      - name: Pipeline draaien
        if: github.event_name != 'push'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: uv run python -m pipeline.run --output public/data

      - name: Push-run vereist een hersteld artefact
        if: github.event_name == 'push'
        run: test -f public/data/manifest.json

      - name: Statische frontend samenstellen
        run: |
          cp -a web/. public/
          cp assets/places.eu.json.gz public/data/places.eu.json.gz

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
